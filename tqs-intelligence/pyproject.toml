[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tqs-intelligence"
version = "0.2.0"
description = "TraderQuest Intelligence Engine: multi-market collection, anomaly discovery, research queue and Russian dashboard."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "duckdb>=1.3,<2",
  "feedparser>=6.0.11,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]
analytics = ["polars>=1.32,<2", "pyarrow>=21,<22"]

[project.scripts]
tqs-intelligence = "tqs_intelligence.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tqs_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
