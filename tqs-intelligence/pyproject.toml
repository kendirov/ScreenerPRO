[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tqs-intelligence"
version = "0.13.11"
description = "TQS Platform local intelligence: instrument-first trader cockpit, multi-market collection, Metric Lake, account/position intelligence, research/strategy machine and Windows launcher."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "duckdb>=1.3,<2",
  "feedparser>=6.0.11,<7",
  "polars>=1.32,<2",
  "pyarrow>=21,<23",
  "psutil>=6.1,<8",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]
analytics = []

[project.scripts]
tqs-intelligence = "tqs_intelligence.api:main"
tqs-supervisor = "tqs_intelligence.supervisor:main"
tqs-launcher = "tqs_intelligence.launcher_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tqs_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
