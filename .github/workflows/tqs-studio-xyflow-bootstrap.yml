name: TQS Studio XYFlow bootstrap

on:
  push:
    branches:
      - chatgpt/tqs-studio-v6-productization-2026-10-04
    paths:
      - .github/workflows/tqs-studio-xyflow-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tqs-studio-v6-productization-2026-10-04
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --dir frontend add @xyflow/react@12.12.0 --ignore-workspace-root-check
      - name: Commit dependency and remove bootstrap workflow
        run: |
          rm -f .github/workflows/tqs-studio-xyflow-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json pnpm-lock.yaml .github/workflows/tqs-studio-xyflow-bootstrap.yml
          git commit -m "Add React Flow canvas engine"
          git push origin HEAD:chatgpt/tqs-studio-v6-productization-2026-10-04
