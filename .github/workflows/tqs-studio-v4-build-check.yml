name: TQS Studio V4 Build Check
on:
  push:
    branches:
      - chatgpt/tqs-studio-world-v4-2026-10-03
  workflow_dispatch:
concurrency:
  group: tqs-studio-v4-build-check
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir frontend build
