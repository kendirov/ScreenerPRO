name: TQS Intelligence CI

on:
  push:
    branches:
      - codex/tqs-research-strategy-machine-v0-4-2026-09-17
      - codex/tqs-intelligence-engine-v0-1-2026-09-17
    paths:
      - 'tqs-intelligence/**'
      - '.github/workflows/tqs-intelligence-ci.yml'
  pull_request:
    paths:
      - 'tqs-intelligence/**'
      - '.github/workflows/tqs-intelligence-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tqs-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tqs-intelligence/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Python tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
      - name: API import
        run: python -c "from tqs_intelligence.api import app; assert app.version == '0.4.0'; print('API import PASS', app.version)"
      - name: Dashboard JavaScript syntax
        run: node --check src/tqs_intelligence/static/app.js
