name: TQS Intelligence CI

on:
  push:
    branches:
      - codex/tqs-research-strategy-machine-v0-4-2026-09-17
      - codex/tqs-intelligence-engine-v0-1-2026-09-17
    paths:
      - 'tqs-intelligence/**'
      - '.github/workflows/tqs-intelligence-ci.yml'
  pull_request:
    paths:
      - 'tqs-intelligence/**'
      - '.github/workflows/tqs-intelligence-ci.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tqs-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tqs-intelligence/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Python tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/tqs-pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish pytest failure to PR
        if: github.event_name == 'pull_request' && steps.pytest.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/tqs-pytest.log', 'utf8');
            const body = `### TQS CI pytest failure\n\n\`\`\`text\n${raw.slice(-12000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Enforce pytest result
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
      - name: Compile
        run: python -m compileall -q src
      - name: API import and trader surface contract
        run: |
          python - <<'PY'
          from tqs_intelligence.api import app
          assert app.version == '0.6.0'
          paths = {route.path for route in app.routes}
          required = {'/api/instrument/{canonical_id:path}', '/api/overview', '/api/anomalies', '/api/strategies', '/api/research/findings', '/api/briefing'}
          missing = required - paths
          assert not missing, missing
          print('API/trader surface PASS', app.version)
          PY
      - name: Dashboard JavaScript syntax
        run: |
          node --check src/tqs_intelligence/static/app.js
          node --check src/tqs_intelligence/static/account-intelligence.js
      - name: Trader cockpit HTML contract
        run: |
          grep -q 'UNIVERSAL INSTRUMENT LAB' src/tqs_intelligence/static/index.html
          grep -q 'ПУЛЬС МАШИНЫ' src/tqs_intelligence/static/index.html
          grep -q 'Strategy pulse' src/tqs_intelligence/static/index.html
          grep -q 'Research pulse' src/tqs_intelligence/static/index.html
          grep -q 'Обновить продукт' src/tqs_intelligence/static/index.html
