name: Kids Device Hub Android

on:
  pull_request:
    paths:
      - 'kids-device-hub/android/**'
      - '.github/workflows/kids-device-hub-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-device-hub/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail
          ls "$ANDROID_HOME/build-tools" | tail
      - name: Build debug APK
        run: gradle --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kendirov-Kids-Device-Hub-Android
          path: kids-device-hub/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="app/build/outputs/apk/debug/app-debug.apk"
          TAG="kids-device-hub-v1"
          NAME="Kendirov-Kids-Device-Hub-Roma-v1.apk"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Kids Device Hub Android v1" --notes "Roma Lenovo Tab Android agent."
          gh release upload "$TAG" "$ASSET#$NAME" --clobber --repo "$GITHUB_REPOSITORY"
