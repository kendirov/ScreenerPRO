name: Chat-first LIVE provider check

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tqs-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: LIVE provider/runtime sample
        id: live
        continue-on-error: true
        run: bash scripts/ci/verify-live.sh
      - name: Write LIVE evidence
        if: always()
        run: python scripts/ci/write_verification_summary.py live ${{ steps.live.outcome == 'success' && 'pass' || 'partial' }}
      - name: Upload LIVE evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-evidence-${{ github.sha }}-${{ github.run_id }}
          path: .verification/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Surface app-level failure
        if: steps.live.outcome != 'success'
        run: echo 'LIVE provider/runtime check is degraded; inspect artifact. It is intentionally separate from deterministic merge gates.'
