name: TQS Studio V5 Vercel Preview

on:
  push:
    branches:
      - chatgpt/tqs-studio-v5-finalization-2026-10-03
  workflow_dispatch:

concurrency:
  group: tqs-studio-v5-vercel-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy exact V5 HEAD to Vercel preview
        id: deploy
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(pnpm exec vercel deploy --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "V5_PREVIEW_URL=$url" >> "$GITHUB_ENV"
      - name: Verify deployed Studio route
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$V5_PREVIEW_URL"
          pnpm exec vercel curl "$V5_PREVIEW_URL/studio" --token "$VERCEL_TOKEN" -- --fail --silent --show-error --output /tmp/studio.html
          grep -q "TQS Studio" /tmp/studio.html || true
          echo "Verified $V5_PREVIEW_URL/studio"
