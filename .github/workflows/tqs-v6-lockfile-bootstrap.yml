name: TQS V6 Lockfile Bootstrap
on:
  push:
    branches:
      - chatgpt/tqs-studio-v6-productization-2026-10-04
    paths:
      - .github/workflows/tqs-v6-lockfile-bootstrap.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tqs-studio-v6-productization-2026-10-04
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add server PDF runtime
        run: pnpm --dir frontend add puppeteer-core@25.11.0 @sparticuz/chromium@153.0.0
      - name: Commit lockfile
        run: |
          git config user.name "tqs-studio-v6-bot"
          git config user.email "93733593+kendirov@users.noreply.github.com"
          git add frontend/package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Add V6 Chromium PDF runtime"
          git push origin HEAD:chatgpt/tqs-studio-v6-productization-2026-10-04
