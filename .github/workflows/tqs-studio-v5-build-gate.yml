name: TQS Studio V5 Build Gate
on:
  push:
    branches:
      - chatgpt/tqs-studio-v5-finalization-2026-10-03
  workflow_dispatch:
concurrency:
  group: tqs-studio-v5-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir frontend build
